name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    name: engine (${{ matrix.os }}, ${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        preset: [debug, release, asan]
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja and a Latin-1 locale (Linux)
        if: runner.os == 'Linux'
        # The Latin-1 locale makes SymbolValidationIgnoresTheProcessLocale meaningful on glibc,
        # whose UTF-8 locales never classify single high bytes as letters.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build locales
          sudo locale-gen en_US en_US.UTF-8
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel 4

  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Build extension and install packages
        # --locked also fails if uv.lock is stale, including its copy of the build pins.
        run: uv sync --all-packages --locked --python 3.12
      - name: Lint
        run: |
          uv run --frozen ruff check python backend
          uv run --frozen ruff format --check python backend
      - name: Type-check
        run: uv run --frozen mypy
      - name: Test
        run: uv run --frozen pytest

  wheel:
    # The python job tests an editable install, which reads the package from the source tree.
    # This builds the real wheel, with the bindings compiled under -Werror, and tests it as
    # installed, so a packaging regression (a missing stub, py.typed or subpackage) fails here.
    name: wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Build the wheel (bindings compiled with warnings as errors)
        run: >-
          uv build --wheel --python 3.12 --out-dir dist
          -C cmake.define.UDESHI_WARNINGS_AS_ERRORS=ON
      - name: Install the wheel into a fresh environment
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          uv export --frozen --only-group dev --no-emit-workspace --quiet -o "$RUNNER_TEMP/dev.txt"
          uv pip install --python "$RUNNER_TEMP/venv" --require-hashes -r "$RUNNER_TEMP/dev.txt"
          uv pip install --python "$RUNNER_TEMP/venv" --no-deps dist/*.whl
      - name: Test the installed wheel
        working-directory: ${{ runner.temp }}
        # importlib mode leaves sys.path alone, so the tests import the installed package.
        run: |
          venv/bin/python -c "import udeshi_markets as um; assert 'site-packages' in um.__file__, um.__file__"
          venv/bin/python -m pytest -p no:cacheprovider --import-mode=importlib \
            "$GITHUB_WORKSPACE/python/tests/test_bindings.py" \
            "$GITHUB_WORKSPACE/python/tests/test_stubs.py"

  docker:
    name: docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build image
        run: docker build -f backend/Dockerfile -t udeshi-api:ci .
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 udeshi-api:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health && break
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:8000/api/simulations \
            -H 'content-type: application/json' -d '{"duration_seconds": 5, "speed": 100}'
          curl -fsS http://127.0.0.1:8000/api/markets | python3 -c \
            "import json,sys; m=json.load(sys.stdin); assert len(m)==5, m; print('markets ok')"
          docker inspect --format '{{.Config.User}}' api | grep -qx app
      - name: Container logs
        if: always()
        run: docker logs api || true

