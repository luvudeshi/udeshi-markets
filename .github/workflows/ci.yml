name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    name: engine (${{ matrix.os }}, ${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        preset: [debug, release, asan]
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja and a Latin-1 locale (Linux)
        if: runner.os == 'Linux'
        # The Latin-1 locale makes SymbolValidationIgnoresTheProcessLocale meaningful on glibc,
        # whose UTF-8 locales never classify single high bytes as letters.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build locales
          sudo locale-gen en_US en_US.UTF-8
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel 4

  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Build extension and install packages
        # --locked also fails if uv.lock is stale, including its copy of the build pins.
        run: uv sync --all-packages --locked --python 3.12
      - name: Lint
        run: |
          uv run --frozen ruff check python backend
          uv run --frozen ruff format --check python backend
      - name: Type-check
        run: uv run --frozen mypy
      - name: Test
        run: uv run --frozen pytest

  postgres:
    # The storage layer and the experiments API against a real PostgreSQL (service containers
    # need a Linux runner, so this is its own job; the python job runs them on SQLite).
    name: postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: udeshi
          POSTGRES_PASSWORD: udeshi
          POSTGRES_DB: udeshi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U udeshi -d udeshi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UDESHI_TEST_DATABASE_URL: postgresql+psycopg://udeshi:udeshi@localhost:5432/udeshi_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build extension and install packages
        run: uv sync --all-packages --locked --python 3.12
      - name: Storage and experiments on PostgreSQL
        run: uv run --frozen pytest backend/tests/test_storage.py backend/tests/test_experiments_api.py -v

  frontend:
    # The trading terminal: lint, types (including that the generated API types match the
    # backend's OpenAPI schema), unit tests, then Playwright against the real backend and a
    # production build.
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build extension and install packages
        working-directory: .
        run: uv sync --all-packages --locked --python 3.12
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generated API types are up to date
        run: |
          uv run --frozen python -m udeshi_api.openapi > openapi.json
          npm run generate:api
          git diff --exit-code -- openapi.json src/lib/api-types.ts
      - name: Lint and format
        run: |
          npm run lint
          npm run format:check
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npx playwright test
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  wheel:
    # The python job tests an editable install, which reads the package from the source tree.
    # This builds the real wheel, with the bindings compiled under -Werror, and tests it as
    # installed, so a packaging regression (a missing stub, py.typed or subpackage) fails here.
    name: wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Build the wheel (bindings compiled with warnings as errors)
        run: >-
          uv build --wheel --python 3.12 --out-dir dist
          -C cmake.define.UDESHI_WARNINGS_AS_ERRORS=ON
      - name: Install the wheel into a fresh environment
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          uv export --frozen --only-group dev --no-emit-workspace --quiet -o "$RUNNER_TEMP/dev.txt"
          uv pip install --python "$RUNNER_TEMP/venv" --require-hashes -r "$RUNNER_TEMP/dev.txt"
          uv pip install --python "$RUNNER_TEMP/venv" --no-deps dist/*.whl
      - name: Test the installed wheel
        working-directory: ${{ runner.temp }}
        # importlib mode leaves sys.path alone, so the tests import the installed package.
        run: |
          venv/bin/python -c "import udeshi_markets as um; assert 'site-packages' in um.__file__, um.__file__"
          venv/bin/python -m pytest -p no:cacheprovider --import-mode=importlib \
            "$GITHUB_WORKSPACE/python/tests/test_bindings.py" \
            "$GITHUB_WORKSPACE/python/tests/test_stubs.py"

  docker:
    name: docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build images
        run: |
          docker build -f backend/Dockerfile -t udeshi-api:ci .
          docker build -t udeshi-web:ci frontend
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 udeshi-api:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health && break
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:8000/api/simulations \
            -H 'content-type: application/json' -d '{"duration_seconds": 5, "speed": 100}'
          curl -fsS http://127.0.0.1:8000/api/markets | python3 -c \
            "import json,sys; m=json.load(sys.stdin); assert len(m)==5, m; print('markets ok')"
          docker inspect --format '{{.Config.User}}' api | grep -qx app
      - name: Smoke test the terminal
        run: |
          docker run -d --name web -p 3000:3000 -e UDESHI_API_URL=http://127.0.0.1:8000 udeshi-web:ci
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:3000/ && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/ | grep -q "Udeshi Markets"
          curl -fsS http://127.0.0.1:3000/experiments | grep -q "Experiments"
          docker inspect --format '{{.Config.User}}' web | grep -qx app
      - name: Container logs
        if: always()
        run: |
          docker logs api || true
          docker logs web || true

