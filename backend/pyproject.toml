[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "udeshi-api"
version = "0.2.0"
description = "FastAPI service exposing the Udeshi Markets simulated exchange"
requires-python = ">=3.12"
dependencies = [
  "udeshi-markets",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
]

[tool.uv.sources]
udeshi-markets = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["udeshi_api"]
