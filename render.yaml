# Render Blueprint for the API (the terminal is deployed on Vercel; see docs/deployment.md).
#   Render dashboard -> New -> Blueprint -> this repository.
# The image is backend/Dockerfile: it compiles the C++ engine and runs the FastAPI service.
services:
  - type: web
    name: udeshi-markets-api
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    # Only changes to what the image is built from redeploy it (each redeploy also restarts the
    # service and loses its in-memory simulations): not the frontend, docs, tools or tests.
    buildFilter:
      paths:
        - backend/**
        - engine/**
        - python/**
        - pyproject.toml
        - uv.lock
        - CMakeLists.txt
        - CMakePresets.json
        - render.yaml
      ignoredPaths:
        - "**/*.md"
        - backend/tests/**
        - engine/tests/**
        - python/tests/**
    healthCheckPath: /api/health
    envVars:
      # The image listens on 8000 (UDESHI_PORT); Render routes traffic to PORT.
      - key: PORT
        value: "8000"
      # The terminal's origin: the browser calls the API from it, REST and WebSocket.
      - key: UDESHI_CORS_ORIGINS
        value: https://udeshi-markets.vercel.app
      # A free instance has 512 MB: few live simulations, one experiment worker process.
      - key: UDESHI_MAX_SESSIONS
        value: "4"
      - key: UDESHI_EXPERIMENT_WORKERS
        value: "1"
      # Bars a live simulation may keep (about 180 bytes each): five symbols' 1-second bars
      # for 5.5 simulated hours, or a day at 5-second bars. The default, 500,000, lets four
      # simulations hold most of the 512 MB.
      - key: UDESHI_MAX_BARS
        value: "100000"
